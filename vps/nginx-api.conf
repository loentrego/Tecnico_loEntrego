# LoEntrego · paso a la API (se instala en /etc/nginx/snippets/loentrego-api.conf)
# Se incluye en app y admin: así cada frontend llama a /api en su mismo dominio.
location = /api/login {
  limit_req zone=login burst=5 nodelay;
  proxy_pass http://loentrego_api;
  include /etc/nginx/proxy_params;
}
location /api/ {
  limit_req zone=api burst=40 nodelay;
  proxy_pass http://loentrego_api;
  include /etc/nginx/proxy_params;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
}
# Webhooks de WhatsApp/Meta (los manda Meta)
location /webhooks/ {
  proxy_pass http://loentrego_api;
  include /etc/nginx/proxy_params;
}
