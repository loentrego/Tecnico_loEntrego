# LoEntrego · lo común a los 3 sitios (se instala en /etc/nginx/snippets/loentrego-comun.conf)
server_tokens off;
client_max_body_size 8m;                     # fotos de evidencia
charset utf-8;
index index.html;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# Archivos con ?v= en la URL: caché larga (cada cambio sube la versión)
location ~* \.(css|js|png|jpg|jpeg|svg|woff2|json|txt|webmanifest)$ {
  expires 30d;
  try_files $uri =404;
}

# ---------- Página de mantenimiento ----------
# Sus archivos se sirven siempre desde /_mantenimiento/ (también cuando está prendida)
location ^~ /_mantenimiento/ {
  alias /srv/loentrego/www/mantenimiento/;
}
# Cuando el sitio está en mantenimiento, cualquier página responde 503 con "Volvemos pronto"
error_page 503 /_mantenimiento.html;
location = /_mantenimiento.html {
  internal;
  root /srv/loentrego/www/mantenimiento;
  try_files /index.html =404;
  sub_filter '<head>' '<head><base href="/_mantenimiento/">';
  sub_filter_once on;
  add_header Retry-After 600 always;
  add_header Cache-Control "no-store" always;
}
