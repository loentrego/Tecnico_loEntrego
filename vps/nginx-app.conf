# =====================================================================
#  LoEntrego · Nginx del VPS (Bluehost)
#  Todo lo que la gente abre está aquí: los 4 frontends y la API.
#    loentrego.com, www  → web pública      (/srv/loentrego/www/web)
#    app.loentrego.com   → AppWeb (PWA)     (/srv/loentrego/www/app)
#    admin.loentrego.com → panel admin      (/srv/loentrego/www/admin)
#    /api/ en cada uno   → API Node.js (127.0.0.1:3000), mismo origen: sin CORS
#  Mantenimiento por sitio, sin tocar código:
#    touch /srv/loentrego/mantenimiento/app.on   → app muestra "Volvemos pronto"
#    rm    /srv/loentrego/mantenimiento/app.on   → vuelve a la normalidad
#  Certbot agrega los bloques HTTPS (443) y la redirección desde HTTP.
# =====================================================================

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;    # inicio de sesión
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;      # resto de la API
limit_req_zone $binary_remote_addr zone=formularios:10m rate=5r/m; # formularios públicos

upstream loentrego_api {
  server 127.0.0.1:3000;
  keepalive 32;
}

# ---------- Web pública ----------
server {
  listen 80;
  listen [::]:80;
  server_name loentrego.com www.loentrego.com;
  root /srv/loentrego/www/web;
  include /etc/nginx/snippets/loentrego-comun.conf;

  # La web solo usa las rutas públicas (formulario Únete, cobertura)
  location /api/publico/ {
    limit_req zone=formularios burst=10 nodelay;
    proxy_pass http://loentrego_api;
    include /etc/nginx/proxy_params;
  }

  location / {
    if (-f /srv/loentrego/mantenimiento/web.on) { return 503; }
    try_files $uri $uri/ =404;
  }
}

# ---------- AppWeb: comercios y repartidores ----------
server {
  listen 80;
  listen [::]:80;
  server_name app.loentrego.com;
  root /srv/loentrego/www/app;
  include /etc/nginx/snippets/loentrego-comun.conf;
  include /etc/nginx/snippets/loentrego-api.conf;

  # El service worker nunca se guarda en caché (si no, la app no se actualiza)
  location = /sw.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }

  location / {
    if (-f /srv/loentrego/mantenimiento/app.on) { return 503; }
    try_files $uri $uri/ =404;
  }
}

# ---------- Panel admin ----------
server {
  listen 80;
  listen [::]:80;
  server_name admin.loentrego.com;
  root /srv/loentrego/www/admin;
  include /etc/nginx/snippets/loentrego-comun.conf;
  include /etc/nginx/snippets/loentrego-api.conf;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location / {
    if (-f /srv/loentrego/mantenimiento/admin.on) { return 503; }
    try_files $uri $uri/ =404;
  }
}
