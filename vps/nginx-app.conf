# LoEntrego · Nginx para la API (app.loentrego.com)
# Certbot agrega el bloque HTTPS (listen 443 ssl) y la redirección desde HTTP.

# 10 intentos por minuto por IP en el inicio de sesión
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# 20 solicitudes por segundo por IP para el resto de la API
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream loentrego_api {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name app.loentrego.com;

  client_max_body_size 8m;          # fotos de evidencia
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_types application/json text/plain text/css application/javascript;

  location = /api/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://loentrego_api;
    include /etc/nginx/proxy_params;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://loentrego_api;
    include /etc/nginx/proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # Webhooks de WhatsApp/Meta (sin límite estricto: los manda Meta)
  location /webhooks/ {
    proxy_pass http://loentrego_api;
    include /etc/nginx/proxy_params;
  }

  location / { return 404; }
}
